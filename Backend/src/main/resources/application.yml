# ======================================================
# SERVER CONFIGURATION
# ======================================================

server:
  port: ${PORT:8080}

spring:
    datasource:
      url: ${SPRING_DATASOURCE_URL}
      username: ${SPRING_DATASOURCE_USERNAME}
      password: ${SPRING_DATASOURCE_PASSWORD}
    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      open-in-view: false

google:
    books:
      api:
        key: ${GOOGLE_BOOKS_API_KEY}
