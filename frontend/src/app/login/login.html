<div class="page-wrapper">

  <!-- ================= TOAST NOTIFICATION ================= -->
  <div class="toast-container" *ngIf="showToast" [ngClass]="'toast-' + toastType">

    <!-- Icon -->
    <span class="toast-icon">

      <!-- Spinner for checking/waking -->
      <span *ngIf="serverStatus === 'checking' || serverStatus === 'waking'" class="toast-spinner"></span>

      <!-- Checkmark for online -->
      <svg *ngIf="serverStatus === 'online'"
           viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>

      <!-- X for offline -->
      <svg *ngIf="serverStatus === 'offline'"
           viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>

    </span>

    <span class="toast-text">{{ toastMessage }}</span>

    <!-- Retry button if offline -->
    <button *ngIf="serverStatus === 'offline'" class="toast-retry" (click)="checkBackendStatus()">
      Retry
    </button>

    <!-- Close button -->
    <button class="toast-close" (click)="showToast = false">✕</button>

  </div>

  <div class="login-card">

    <!-- ================= HEADER ================= -->
    <div class="login-header">

      <img src="/mapua-logo.png"
           alt="Mapua Logo"
           class="logo" />

      <div class="text-section">
        <span class="library-text">MAPÚA LIBRARY</span>
        <span class="divider">|</span>
        <span class="platform-text">CATALOGING SEARCH PLATFORM</span>
      </div>

    </div>

    <!-- ================= WELCOME SECTION ================= -->
    <div class="welcome-section">
      <h2>Welcome to the MAPÚA Library</h2>
      <p>Please sign in to continue.</p>
    </div>

    <!-- ================= EMAIL ================= -->
    <div class="form-group">
      <label>Email:</label>
      <input
        type="email"
        [(ngModel)]="email"
        placeholder="user@mymail.mapua.edu.ph"
        [disabled]="isLoggingIn"
      />
    </div>

    <!-- ================= PASSWORD ================= -->
    <div class="form-group">
      <label>Password:</label>

      <div class="password-wrapper">
        <input
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          placeholder="Enter password"
          [disabled]="isLoggingIn"
        />

        <button
          type="button"
          class="toggle-password"
          (click)="togglePassword()">

          <!-- Eye Open -->
          <svg *ngIf="!showPassword"
               xmlns="http://www.w3.org/2000/svg"
               viewBox="0 0 24 24"
               fill="none"
               stroke="currentColor"
               stroke-width="2"
               stroke-linecap="round"
               stroke-linejoin="round"
               class="eye-icon">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>

          <!-- Eye Closed -->
          <svg *ngIf="showPassword"
               xmlns="http://www.w3.org/2000/svg"
               viewBox="0 0 24 24"
               fill="none"
               stroke="currentColor"
               stroke-width="2"
               stroke-linecap="round"
               stroke-linejoin="round"
               class="eye-icon">
            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 1 12 1 12a21.76 21.76 0 0 1 5.06-6.94"/>
            <path d="M1 1l22 22"/>
          </svg>

        </button>
      </div>
    </div>

    <!-- ================= LOGIN BUTTON ================= -->
    <button class="login-btn" (click)="login()" [disabled]="isLoggingIn">

      <!-- Spinner while logging in -->
      <span *ngIf="isLoggingIn" class="btn-spinner"></span>
      <span *ngIf="isLoggingIn">Signing in...</span>
      <span *ngIf="!isLoggingIn">Sign In</span>

    </button>

    <!-- ================= LINKS SECTION ================= -->
    <div class="login-links">

      <p class="forgot-link" (click)="goToReset()">
        Forgot Password?
      </p>

      <p class="register-link" (click)="goToRegister()">
        Create Account
      </p>

    </div>

    <!-- ================= ERROR MESSAGE ================= -->
    <p class="error" *ngIf="errorMessage">
      {{ errorMessage }}
    </p>

  </div>

</div>
